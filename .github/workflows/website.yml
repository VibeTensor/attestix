          PATHS = ['.oxlintrc.json', 'README.md', 'components.json', 'content/docs/examples.mdx', 'content/docs/getting-started.mdx', 'content/docs/guides/architecture.mdx', 'content/docs/guides/base-l2-anchor.mdx', 'content/docs/guides/crewai.mdx', 'content/docs/guides/eu-ai-act-compliance.mdx', 'content/docs/guides/eu-compliance-walkthrough.mdx', 'content/docs/guides/integration-guide.mdx', 'content/docs/guides/langchain.mdx', 'content/docs/guides/meta.json', 'content/docs/guides/migration-npm-rename.mdx', 'content/docs/guides/migration-v0.4.0-namespace.mdx', 'content/docs/guides/offline-verify.mdx', 'content/docs/guides/openai-agents-sdk.mdx', 'content/docs/guides/reputation.mdx', 'content/docs/guides/risk-classification.mdx', 'content/docs/index.mdx', 'content/docs/meta.json', 'content/docs/project/changelog.mdx', 'content/docs/project/contributing.mdx', 'content/docs/project/meta.json', 'content/docs/project/research.mdx', 'content/docs/project/roadmap.mdx', 'content/docs/quickstart/ai-safety-research.mdx', 'content/docs/quickstart/devtools-skeptic.mdx', 'content/docs/quickstart/enterprise-architect.mdx', 'content/docs/quickstart/fintech-compliance.mdx', 'content/docs/quickstart/grc-consultant.mdx', 'content/docs/quickstart/healthcare-ml.mdx', 'content/docs/quickstart/index.mdx', 'content/docs/quickstart/indie-dev.mdx', 'content/docs/quickstart/meta.json', 'content/docs/quickstart/mlops-engineer.mdx', 'content/docs/quickstart/startup-cto.mdx', 'content/docs/quickstart/web3-onchain.mdx', 'content/docs/reference/api-reference.mdx', 'content/docs/reference/concepts.mdx', 'content/docs/reference/configuration.mdx', 'content/docs/reference/faq.mdx', 'content/docs/reference/glossary.mdx', 'content/docs/reference/mcp-tools.mdx', 'content/docs/reference/meta.json', 'content/docs/reference/troubleshooting.mdx', 'content/docs/security/fria-template.mdx', 'content/docs/security/iso-42001-mapping.mdx', 'content/docs/security/meta.json', 'content/docs/security/nist-ai-rmf-m