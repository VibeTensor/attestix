          python3 - <<'PY'
          """Classify one approved deployment log without emitting vendor text."""
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          ACCOUNT = '8f976964427710aa2c2b28f3eb2d62d2'
