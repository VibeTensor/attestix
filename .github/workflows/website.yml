name: Read fixed Cloudflare preview diagnostic categories

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'VibeTensor/attestix' && github.ref == 'refs/heads/fix/cloudflare-preview-logs-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read only the approved failed preview log
        env:
          CF_DIAGNOSTIC_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_DIAGNOSTIC_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
