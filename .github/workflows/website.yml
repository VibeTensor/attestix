', 'src/app/(marketing)/demo/fine-calculator/page.tsx', 'src/app/(marketing)/demo/identity-explorer/identity-explorer.tsx', 'src/app/(marketing)/demo/identity-explorer/page.tsx', 'src/app/(marketing)/demo/page.tsx', 'src/app/(marketing)/demo/reputation-dashboard/data.ts', 'src/app/(marketing)/demo/reputation-dashboard/page.tsx', 'src/app/(marketing)/demo/reputation-dashboard/reputation-dashboard.tsx', 'src/app/(marketing)/faq/page.tsx', 'src/app/(marketing)/india/page.tsx', 'src/app/(marketing)/layout.tsx', 'src/app/(marketing)/platform/page.tsx', 'src/app/(marketing)/pricing/page.tsx', 'src/app/(marketing)/research/page.tsx', 'src/app/(marketing)/research/paper/page.tsx', 'src/app/(marketing)/sbom/page.tsx', 'src/app/(marketing)/security/page.tsx', 'src/app/(marketing)/spec/bundle/v1/page.tsx', 'src/app/(marketing)/uk/page.tsx', 'src/app/(marketing)/verify/page.tsx', 'src/app/(marketing)/verify/verify-client.tsx', 'src/app/api/search/route.ts', 'src/app/cross-post/page.tsx', 'src/app/docs/[[...slug]]/page.tsx', 'src/app/docs/layout.tsx', 'src/app/feed.json/route.ts', 'src/app/feed.xml/route.ts', 'src/app/globals.css', 'src/app/layout.tsx', 'src/app/legal/cookies/page.tsx', 'src/app/legal/layout.tsx', 'src/app/legal/privacy/page.tsx', 'src/app/legal/terms/page.tsx', 'src/app/page.tsx', 'src/app/robots.ts', 'src/app/sitemap.ts', 'src/components/article-aside.tsx', 'src/components/atx/atx-command-palette.tsx', 'src/components/atx/atx-cookie-consent.tsx', 'src/components/atx/atx-copy-text.tsx', 'src/components/atx/atx-countdown.tsx', 'src/components/atx/atx-create-identity-modal.tsx', 'src/components/atx/atx-eyebrow.tsx', 'src/components/atx/atx-icons.tsx', 'src/components/atx/atx-substack-subscribe.tsx', 'src/components/atx/console-tour.tsx', 'src/components/blog-author.tsx', 'src/components/blog-card.tsx', 'src/components/icons.tsx', 'src/components/mermaid.tsx', 'src/components/mobile-drawer.tsx', 'src/components/post-list.tsx', 'src/components/search.tsx', 'src/components/sections/community.tsx', 'src/components/sections/faq.tsx', 'src/components/sections/header.tsx', 'src/components/sections/home/home-demo.tsx', 'src/components/sections/home/sections.tsx', 'src/components/sections/v2/benchmarks.tsx', 'src/components/sections/v2/compliance-matrix.tsx', 'src/components/sections/v2/console-preview.tsx', 'src/components/sections/v2/cta-v2.tsx', 'src/components/sections/v2/footer-v2.tsx', 'src/components/sections/v2/frameworks.tsx', 'src/components/sections/v2/hero-cert.tsx', 'src/components/sections/v2/hero-stats.tsx', 'src/components/sections/v2/hero-v2.tsx', 'src/components/sections/v2/modules.tsx', 'src/components/sections/v2/problem.tsx', 'src/components/sections/v2/standards-strip.tsx', 'src/components/sections/v2/use-cases.tsx', 'src/components/sections/v2/validation.tsx', 'src/components/sections/v2/workflow.tsx', 'src/components/tailwind-indicator.tsx', 'src/components/theme-provider.tsx', 'src/components/theme-toggle.tsx', 'src/components/ui/accordion.tsx', 'src/components/ui/badge.tsx', 'src/components/ui/button.tsx', 'src/components/ui/drawer.tsx', 'src/components/ui/input.tsx', 'src/components/ui/label.tsx', 'src/lib/animation.ts', 'src/lib/atx-console-data.ts', 'src/lib/atx-data.ts', 'src/lib/atx-frameworks.ts', 'src/lib/billing.ts', 'src/lib/blog.ts', 'src/lib/config.tsx', 'src/lib/credential-boundary.ts', 'src/lib/samples/sample-tampered-vc.json', 'src/lib/samples/sample-valid-vc.json', 'src/lib/source.ts', 'src/lib/utils.ts', 'src/lib/verify-samples.ts', 'tsconfig.json']
          CODES = {'ENOMEM', 'ENOSPC', 'EACCES', 'EPERM', 'ENOENT', 'ETIMEDOUT', 'ECONNRESET', 'EAI_AGAIN', 'ENOTFOUND', 'E404', 'E429', 'E502', 'E503', 'E504', 'ELIFECYCLE', 'EBADENGINE', 'ETARGET', 'ERR_MODULE_NOT_FOUND', 'ERR_PNPM_FETCH_404', 'ERR_PNPM_FETCH_429', 'ERR_PNPM_FETCH_502', 'ERR_PNPM_FETCH_503', 'ERR_PNPM_FETCH_504', 'ERESOLVE', 'EUSAGE', 'ELOCKVERIFY'}
          PATTERNS = {
              'cancellation': r'\bcancel(?:l)?(?:ed|ation)\b',
              'queue_or_capacity': r'\bqueue(?:d)?\b|concurren(?:cy|t)|capacity|worker pool',
              'resource_acquisition': r'acquir(?:e|ed|ing)|acquisition|allocat(?:e|ion|ing)|build resources|resource provisioning',
              'infrastructure_failure': r'build image|build system|build infrastructure|internal|unexpected',
              'repository_access': r'\brepository\b|\bclone\b|\bgit\b|\bcommit\b|\bfetch\b',
              'repository_authentication': r'unauthorized|forbidden|authentication|permission denied|access denied',
              'configuration': r'configuration|\bconfig\b|wrangler|build command|root directory|output directory',
              'peer_dependency_conflict': r'\bERESOLVE\b|unable to resolve dependency|peer dep',
              'dependency_lock_mismatch': r'\bEUSAGE\b|\bELOCKVERIFY\b|lock file.*(?:sync|mismatch)',
              'time_limit': r'\btimeout\b|timed out|time limit|deadline',
              'generic_failure': r'\bfailed\b|\bfailure\b|\berror\b|\bexception\b',
              'superseded_build': r'superseded|newer commit|outdated',
              'font_fetch_failure': r'next/font|Failed to fetch.*font',
              'network_timeout': r'ETIMEDOUT|UND_ERR_CONNECT_TIMEOUT|ConnectTimeoutError|connection timed out',
              'dns_resolution': r'ENOTFOUND|EAI_AGAIN|getaddrinfo',
              'connection_reset': r'ECONNRESET|socket hang up',
              'registry_rate_limit': r'E429|429 Too Many Requests|ERR_PNPM_FETCH_429',
              'registry_unavailable': r'E50[234]|ERR_PNPM_FETCH_50[234]',
              'package_missing': r'E404|ERR_PNPM_FETCH_404|No matching version found|ETARGET',
              'install_failure': r'npm ERR!|npm error|ELIFECYCLE|ERR_PNPM_',
              'compile_failure': r'Failed to compile|Module build failed|Compilation failed',
              'typescript_error': r'error TS[0-9]{3,5}|Type error:',
              'module_not_found': r'Module not found|Cannot find module|Cannot resolve module|Can.t resolve',
              'prerender_failure': r'Error occurred prerendering|Failed to collect page data',
              'memory_exhaustion': r'heap out of memory|SIGKILL|out of memory',
              'build_timeout': r'Build exceeded|build.*timed out|maximum build time',
              'disk_exhaustion': r'ENOSPC|No space left on device',
              'unsupported_runtime': r'EBADENGINE|Unsupported engine|requires Node.js',
              'platform_error': r'Internal error|internal build error|platform error',
              'deployment_limit': r'too many builds|quota exceeded|deployment limit|build limit',
              'worker_startup_cpu_limit': r'Script startup exceeded CPU time limit',
              'canceled': r'Build cancel[le]+d|deployment cancel[le]+d',
              'git_checkout_error': r'Failed to clone|could not fetch|git.*exit.*128',
              'lint_error': r'Linting failed|lint error',
              'vulnerable_next_version': r'vulnerable version of Next.js detected',
          }


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def emit(http_status, category, **fields):
              print(json.dumps({'http_status': http_status, 'category': category, **fields}, sort_keys=True, ensure_ascii=True))


          def read_deployment_metadata(opener):
              address = URL.removesuffix('/history/logs?size=1000000')
              request = urllib.request.Request(address, headers={'Authorization': 'Bearer ' + os.environ['CF_DIAGNOSTIC_TOKEN']}, method='GET')
              try:
                  with opener.open(request, timeout=30) as response:
                      status = response.status
                      body = response.read(MAX_BYTES + 1)
              except urllib.error.HTTPError as error:
                  emit(error.code, 'metadata_redirect_blocked' if 300 <= error.code < 400 else 'metadata_http_error')
                  return False
              except (urllib.error.URLError, TimeoutError):
                  emit(None, 'metadata_transport_error')
                  return False
              if len(body) > MAX_BYTES:
                  emit(status, 'metadata_response_size_limit')
                  return False
              payload = json.loads(body)
              result = payload.get('result') if isinstance(payload, dict) else None
              if not isinstance(result, dict) or payload.get('success') is not True:
                  emit(status, 'metadata_response_unavailable')
                  return False
              latest = result.get('latest_stage')
              latest = latest if isinstance(latest, dict) else {}
              trigger = result.get('deployment_trigger')
              trigger = trigger if isinstance(trigger, dict) else {}
              source = trigger.get('metadata')
              source = source if isinstance(source, dict) else {}
              stage = latest.get('name')
              state = latest.get('status')
              environment = result.get('environment')
              source_matches = source.get('commit_hash') == EXPECTED_SOURCE
              branch_matches = source.get('branch') == EXPECTED_BRANCH
              preview_matches = environment == 'preview'
              emit(status, 'deployment_metadata_summary',
                   stage=stage if isinstance(stage, str) and stage in STAGES else 'unavailable',
                   status=state if isinstance(state, str) and state in STATES else 'unavailable',
                   environment=environment if environment in {'preview', 'production'} else 'unavailable',
                   source_metadata_present=isinstance(source.get('commit_hash'), str) and isinstance(source.get('branch'), str),
                   source_commit_matches=source_matches, source_branch_matches=branch_matches,
                   preview_environment_matches=preview_matches)
              return source_matches and branch_matches and preview_matches


          def main():
              if os.environ.get('CF_DIAGNOSTIC_ACCOUNT') != ACCOUNT or not os.environ.get('CF_DIAGNOSTIC_TOKEN'):
                  emit(None, 'credential_or_account_scope_unavailable')
                  return 1
              request = urllib.request.Request(URL, headers={'Authorization': 'Bearer ' + os.environ['CF_DIAGNOSTIC_TOKEN']}, method='GET')
              opener = urllib.request.build_opener(NoRedirect())
              if not read_deployment_metadata(opener):
                  return 1
              try:
                  with opener.open(request, timeout=30) as response:
                      status = response.status
                      body = response.read(MAX_BYTES + 1)
              except urllib.error.HTTPError as error:
                  emit(error.code, 'redirect_blocked' if 300 <= error.code < 400 else 'http_error')
                  return 1
              except (urllib.error.URLError, TimeoutError):
                  emit(None, 'transport_error')
                  return 1
              if len(body) > MAX_BYTES:
                  emit(status, 'response_size_limit')
                  return 1
              payload = json.loads(body)
              if not isinstance(payload, dict) or payload.get('success') is not True:
                  emit(status, 'api_reported_failure')
                  return 1
              result = payload.get('result')
              if not isinstance(result, dict) or not isinstance(result.get('data'), list):
                  emit(status, 'response_shape_unavailable')
                  return 1
              lines = [row['line'] for row in result['data'] if isinstance(row, dict) and isinstance(row.get('line'), str)]
              lines = [line for line in lines if not re.search(r'\b[A-Z][A-Z0-9_]*\s*=', line)]
              text = re.sub(r'https?://\S+', '', '\n'.join(lines))
              categories = sorted(name for name, pattern in PATTERNS.items() if re.search(pattern, text, re.I))
              codes = sorted(code for code in CODES if re.search(r'(?<![A-Z0-9_])' + re.escape(code) + r'(?![A-Z0-9_])', text))
              paths = sorted(path for path in PATHS if path in text or 'website/' + path in text)
              stage = result.get('stage')
              state = result.get('status')
              emit(status, 'classified_log_summary', log_count=len(result['data']),
                   stage=stage if stage in {'queued', 'initialize', 'clone_repo', 'build', 'deploy'} else 'unavailable',
                   status=state if state in {'idle', 'active', 'success', 'failure', 'canceled'} else 'unavailable',
                   error_categories=categories, error_codes=codes, known_relative_paths=paths)
              return 0


          try:
              sys.exit(main())
          except Exception:
              emit(None, 'unexpected_response_or_parser_failure')
              sys.exit(1)
          PY
