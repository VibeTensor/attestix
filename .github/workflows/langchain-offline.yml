name: LangChain offline compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: langchain-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  callback:
    name: LangChain ${{ matrix.profile }} (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        profile: [minimum, current]
    env:
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TELEMETRY_OPT_OUT: 'true'
      DO_NOT_TRACK: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install previously audited hash-locked test dependencies
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ".github/requirements/langchain-${PROFILE}.txt"
      - name: Audit the complete profile before importing the SDK
        env:
          PROFILE: ${{ matrix.profile }}
        run: python -m pip_audit --disable-pip --no-deps --require-hashes -r ".github/requirements/langchain-${PROFILE}.txt"
      - name: Install current project without resolving dependencies
        run: |
          python -m pip install . --no-deps --no-build-isolation
          python -m pip check
      - name: Run real SDK callbacks with network and subprocess access denied
        run: python tests/run_langchain_offline.py
