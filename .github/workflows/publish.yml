name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reviewed stable tag already merged to main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  build:
    if: github.repository == 'VibeTensor/attestix' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate stable release selector
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require source already merged to main
        id: source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Reject mismatched or existing release metadata
        run: python release_guard.py source --tag "$RELEASE_TAG" --unpublished

      - name: Install hash-pinned build tools
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Build package
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python -m build --no-isolation
          python release_guard.py artifacts --tag "$RELEASE_TAG" --dist dist

      - name: Upload validated distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Preserve current authentication; an empty token selects configured OIDC.
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: ${{ secrets.PYPI_API_TOKEN == '' }}
          skip-existing: false

  verify-published:
    if: github.repository == 'VibeTensor/attestix' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck reviewed source before executing repository code
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$EXPECTED_SHA"
          test "$SOURCE_SHA" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-release-dist
          path: dist/
      - name: Verify actual published files and compatibility metadata
        run: python release_guard.py published --tag "$RELEASE_TAG" --dist dist
      - name: Install locked dependencies and the verified wheel
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps dist/*.whl
          python -m pip check
      - name: Smoke installed package outside the source tree
        run: |
          cd "$RUNNER_TEMP"
          python -I -c "import attestix; from importlib.metadata import version; from attestix.auth.crypto import generate_ed25519_keypair, sign_message, verify_signature; assert attestix.__version__ == version('attestix'); k,p=generate_ed25519_keypair(); s=sign_message(k,b'release-smoke'); assert verify_signature(p,s,b'release-smoke'); print('Installed registry-matched wheel passed')"

      - name: Record verified release source for downstream evidence
        env:
          SOURCE_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          record = {'release_tag': os.environ['RELEASE_TAG'],
                    'source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'source_event': os.environ['SOURCE_EVENT']}
          Path(os.environ['RUNNER_TEMP'], 'release-source.json').write_text(json.dumps(record))
          PY
      - name: Upload verified release source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-release-source
          path: ${{ runner.temp }}/release-source.json
          if-no-files-found: error
          retention-days: 30
