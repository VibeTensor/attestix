name: Package release checks

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'attestix/__init__.py'
      - 'server.json'
      - 'release_guard.py'
      - 'tests/install/**'
      - 'tests/unit/test_release_guard.py'
      - 'requirements-ci.txt'
      - '.github/workflows/publish*.yml'
      - '.github/workflows/package-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install locked build and test tools
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Exercise fail-closed release gates
        run: python -m pytest tests/unit/test_release_guard.py -q
      - name: Build and validate actual package metadata
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          TAG="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          python release_guard.py source --tag "$TAG"
          python -m build --no-isolation
          python release_guard.py artifacts --tag "$TAG" --dist dist
      - name: Verify clean installation without source-tree shadowing
        run: |
          export ATTESTIX_RUN_INSTALL_SMOKE=1
          export ATTESTIX_RELEASE_WHEEL="$(realpath dist/*.whl)"
          python -m pytest tests/install/test_pip_install_smoke.py -q
