name: Package release checks

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'attestix/**'
      - '**/*.py'
      - 'MANIFEST.in'
      - 'README.md'
      - 'server.json'
      - 'release_guard.py'
      - 'tests/install/**'
      - 'tests/unit/test_release*.py'
      - 'requirements-ci.txt'
      - '.github/workflows/publish*.yml'
      - '.github/workflows/sbom.yml'
      - '.github/workflows/package-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install locked build and test tools
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Exercise fail-closed release gates
        run: python -m pytest tests/unit/test_release_guard.py tests/unit/test_release_source_metadata.py -q
      - name: Build and validate actual package metadata
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          TAG="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          python release_guard.py source --tag "$TAG"
          python -m build --no-isolation
          python release_guard.py artifacts --tag "$TAG" --dist dist
      - name: Verify clean installation without source-tree shadowing
        run: |
          export ATTESTIX_RUN_INSTALL_SMOKE=1
          export ATTESTIX_RELEASE_WHEEL="$(realpath dist/*.whl)"
          python -m pytest tests/install/test_pip_install_smoke.py -q
