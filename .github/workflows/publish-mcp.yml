name: Publish MCP Registry metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'VibeTensor/attestix' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Exchange a short-lived GitHub OIDC identity for registry publishing.
      id-token: write
    steps:
      - name: Checkout approved main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify manifest and published PyPI version
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import tomllib
          import urllib.request
          from pathlib import Path

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          manifest = json.loads(Path('server.json').read_text())
          version = project['version']
          if project['name'] != 'attestix' or not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Unexpected package name or release version')
          if manifest['name'] != 'io.github.VibeTensor/attestix' or manifest['version'] != version:
              raise SystemExit('Manifest and project versions or identity differ')
          packages = manifest.get('packages')
          if not isinstance(packages, list) or len(packages) != 1 or not isinstance(packages[0], dict):
              raise SystemExit('Expected a one-item package list containing an object')
          package = packages[0]
          if package.get('registryType') != 'pypi':
              raise SystemExit('Expected a PyPI package registry type')
          if package.get('identifier') != project['name'] or package.get('version') != version:
              raise SystemExit('Package manifest does not match the project version')
          with urllib.request.urlopen(f'https://pypi.org/pypi/attestix/{version}/json', timeout=30) as response:
              published = json.load(response)
          if published['info']['version'] != version or not published['urls']:
              raise SystemExit('Expected release is not available on PyPI')
          if any(file.get('yanked') for file in published['urls']):
              raise SystemExit('Refusing a yanked PyPI release')
          marker = r'mcp-name:\s*io\.github\.VibeTensor/attestix(?=\s|<|-->)'
          if not re.search(marker, published['info'].get('description') or ''):
              raise SystemExit('Published PyPI description lacks the ownership marker')
          print(f'Manifest, project and published PyPI version match: {version}')
          PY

      - name: Install pinned checksum-verified publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz'
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/mcp-publisher-bin"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/mcp-publisher-bin" mcp-publisher

      - name: Authenticate with GitHub OIDC
        shell: bash
        run: '"$RUNNER_TEMP/mcp-publisher-bin/mcp-publisher" login github-oidc'

      - name: Publish verified metadata
        shell: bash
        run: '"$RUNNER_TEMP/mcp-publisher-bin/mcp-publisher" publish server.json'
