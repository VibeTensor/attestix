name: Publish MCP Registry metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'VibeTensor/attestix' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Exchange a short-lived GitHub OIDC identity for registry publishing.
      id-token: write
    steps:
      - name: Checkout approved main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify manifest and published PyPI version
        shell: bash
        run: |
          VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          python3 release_guard.py published --tag "v$VERSION"

      - name: Install pinned checksum-verified publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz'
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/mcp-publisher-bin"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/mcp-publisher-bin" mcp-publisher

      - name: Authenticate with GitHub OIDC
        shell: bash
        run: '"$RUNNER_TEMP/mcp-publisher-bin/mcp-publisher" login github-oidc'

      - name: Publish verified metadata
        shell: bash
        run: '"$RUNNER_TEMP/mcp-publisher-bin/mcp-publisher" publish server.json'
